services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Bind mount hides image node_modules; the named volume can go stale after package-lock changes.
    # Refresh deps when key deps are missing instead of failing at runtime.
    command: sh -c "if [ ! -f node_modules/bullmq/package.json ] || [ ! -f node_modules/franc-min/package.json ] || [ ! -f node_modules/.prisma/client/default.js ]; then npm ci && npx prisma generate; fi; exec npm run dev"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app?schema=public
      REDIS_URL: redis://redis:6379
      TRANSLATION_PROVIDER: google
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./service-account.json:/app/service-account.json:ro

volumes:
  postgres_data:
  redis_data:

